<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sobel 엣지 검출</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #656d76;
      --border: #d0d7de; --accent: #2563eb; --accent-hover: #1d4ed8;
      --error-bg: #fef2f2; --error: #b91c1c;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .drop {
      display: block; border: 2px dashed var(--border); border-radius: 10px;
      padding: 28px 16px; text-align: center; cursor: pointer; transition: .15s;
    }
    .drop:hover, .drop.over { border-color: var(--accent); background: #eff6ff; }
    .drop strong { color: var(--accent); }
    .drop .name { display: block; margin-top: 6px; color: var(--muted); font-size: .9rem; word-break: break-all; }
    #file { display: none; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; }
    label.inline { display: flex; align-items: center; gap: 8px; }
    select, button, .btn {
      font: inherit; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--border);
      background: #fff; color: var(--text);
    }
    button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
    button.primary:hover, .btn.primary:hover { background: var(--accent-hover); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .btn { text-decoration: none; display: inline-block; }
    .error {
      margin-top: 16px; padding: 10px 14px; border-radius: 8px;
      background: var(--error-bg); color: var(--error); border: 1px solid #fecaca;
    }
    .status { color: var(--muted); font-size: .95rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    figure { margin: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    figcaption { font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    figure img { width: 100%; height: auto; display: block; border-radius: 6px; background: #eee; }
    .placeholder { color: var(--muted); font-size: .9rem; padding: 40px 0; text-align: center; }
  </style>
</head>
<body>
<main>
  <h1>Sobel 엣지 검출</h1>
  <p class="sub">이미지를 업로드하면 Sobel 필터로 엣지를 검출한 결과를 보여주고 다운로드할 수 있습니다.</p>

  <form id="form" class="card">
    <label class="drop" id="drop" for="file">
      <strong>이미지 선택</strong> 또는 여기로 파일을 끌어다 놓으세요
      <span class="name" id="fileName">PNG, JPG, JPEG, BMP, WEBP · 최대 {{ max_mb }}MB</span>
    </label>
    <input type="file" id="file" name="image" accept=".png,.jpg,.jpeg,.bmp,.webp,image/*">

    <div class="controls">
      <label class="inline">커널 크기 (ksize)
        <select id="ksize" name="ksize">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="7">7</option>
        </select>
      </label>
      <button type="submit" class="primary" id="submit" disabled>엣지 검출</button>
      <span class="status" id="status"></span>
    </div>
    <div class="error" id="error" hidden></div>
  </form>

  <div class="grid">
    <figure>
      <figcaption>원본</figcaption>
      <img id="origImg" alt="원본 이미지" hidden>
      <div class="placeholder" id="origPh">이미지를 선택하세요</div>
    </figure>
    <figure>
      <figcaption>결과
        <a class="btn primary" id="download" hidden>결과 다운로드</a>
      </figcaption>
      <img id="resultImg" alt="엣지 검출 결과" hidden>
      <div class="placeholder" id="resultPh">처리 후 결과가 여기에 표시됩니다</div>
    </figure>
  </div>
</main>

<script>
(() => {
  const MAX_BYTES = {{ max_mb }} * 1024 * 1024;
  const ALLOWED = ["png", "jpg", "jpeg", "bmp", "webp"];
  const $ = (id) => document.getElementById(id);
  const form = $("form"), fileInput = $("file"), drop = $("drop"), submitBtn = $("submit");
  const statusEl = $("status"), errorEl = $("error"), fileNameEl = $("fileName");
  const origImg = $("origImg"), origPh = $("origPh");
  const resultImg = $("resultImg"), resultPh = $("resultPh"), dl = $("download");
  let file = null, origUrl = null, resultUrl = null;

  function showError(msg) { errorEl.textContent = msg; errorEl.hidden = !msg; }

  function resetResult() {
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = null;
    resultImg.hidden = true; resultImg.removeAttribute("src");
    resultPh.hidden = false; dl.hidden = true;
  }

  function setFile(f) {
    showError(""); resetResult();
    if (!f) return;
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    if (!f.name.includes(".") || !ALLOWED.includes(ext)) {
      showError("지원하지 않는 파일 형식입니다. (png, jpg, jpeg, bmp, webp)");
      return;
    }
    if (f.size > MAX_BYTES) {
      showError(`파일이 너무 큽니다. 최대 {{ max_mb }}MB까지 업로드할 수 있습니다.`);
      return;
    }
    file = f;
    fileNameEl.textContent = f.name;
    if (origUrl) URL.revokeObjectURL(origUrl);
    origUrl = URL.createObjectURL(f);
    origImg.src = origUrl; origImg.hidden = false; origPh.hidden = true;
    submitBtn.disabled = false;
  }

  fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => {
    e.preventDefault(); drop.classList.add("over");
  }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => {
    e.preventDefault(); drop.classList.remove("over");
  }));
  drop.addEventListener("drop", (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) setFile(f);
  });

  function downloadName(name) {
    const stem = name.replace(/\.[^.]+$/, "") || "image";
    return `${stem}_sobel.png`;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!file) return;
    showError(""); resetResult();
    submitBtn.disabled = true; statusEl.textContent = "처리 중…";
    const fd = new FormData();
    fd.append("image", file);
    fd.append("ksize", $("ksize").value);
    try {
      const res = await fetch("/api/edge", { method: "POST", body: fd });
      if (!res.ok) {
        let msg = `요청 실패 (${res.status})`;
        try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (_) {}
        throw new Error(msg);
      }
      const blob = await res.blob();
      resultUrl = URL.createObjectURL(blob);
      resultImg.src = resultUrl; resultImg.hidden = false; resultPh.hidden = true;
      dl.href = resultUrl; dl.download = downloadName(file.name); dl.hidden = false;
      statusEl.textContent = "완료";
    } catch (err) {
      showError(err.message || "알 수 없는 오류가 발생했습니다.");
      statusEl.textContent = "";
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
